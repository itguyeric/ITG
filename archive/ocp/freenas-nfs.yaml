csiDriver:
  name: "org.democratic-csi.nfs"

storageClasses:
- name: freenas-nfs-csi
  defaultClass: false
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  allowVolumeExpansion: true
  parameters:
    fsType: nfs

  mountOptions:
  - noatime
  - nfsvers=4
  secrets:
    provisioner-secret:
    controller-publish-secret:
    node-stage-secret:
    node-publish-secret:
    controller-expand-secret:

# if your cluster supports snapshots you may enable below
volumeSnapshotClasses: []
#- name: freenas-nfs-csi
#  parameters:
#  # if true, snapshots will be created with zfs send/receive
#  # detachedSnapshots: "false"
#  secrets:
#    snapshotter-secret:

driver:
  config:
    driver: freenas-nfs
    instance_id:
    httpConnection:
      protocol: http
      host: 192.168.1.94
      port: 80
      username: root
      apiKey: TK
      password: TK
      allowInsecure: true
      apiVersion: 2
    sshConnection:
      host: 192.168.1.94
      port: 22
      username: root
      password: TK
      privateKey: |
        -----BEGIN OPENSSH PRIVATE KEY-----
        TK
        -----END OPENSSH PRIVATE KEY-----
    zfs:
      datasetParentName: ocp/nfs/
      detachedSnapshotsDatasetParentName: ocp/snaps/
      datasetEnableQuotas: true
      datasetEnableReservation: false
      datasetPermissionsMode: "0777"
      datasetPermissionsUser: 0
      datasetPermissionsGroup: 0
    nfs:
      shareHost: 192.168.1.94
      shareAlldirs: false
      shareAllowedHosts: []
      shareAllowedNetworks: []
      shareMaprootUser: 0
      shareMaprootGroup: 0
      shareMapallUser: ""
      shareMapallGroup: ""
