apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      containers:
      - name: minecraft
        image: itzg/minecraft-server
        env:
          - name: EULA
            value: "TRUE"
          - name: MEMORY
            value: "4096M"
          - name: MAX_PLAYERS
            value: "10"
        ports:
          - containerPort: 25565
        volumeMounts:
          - mountPath: /data
            name: minecraft-storage
      volumes:
      - name: minecraft-storage
        persistentVolumeClaim:
          claimName: minecraft-pvc
