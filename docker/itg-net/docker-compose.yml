        calibre:
                image: linuxserver/calibre
                container_name: calibre
                ports:
                        - 8082:8080
                        - 8083:8081
                volumes:
                        - /srv/calibre:/config
                restart: unless-stopped
                environment:
                        - PUID=1002
                        - PGID=1002
                        - TZ=America/Chicago
                        - GUAC_USER=erictheitguy
                        - GUAC_PASS=c36800a78f1a4d0ac514aedb2bb517f4

        letsencrypt:
                image: linuxserver/letsencrypt
                container_name: le
                cap_add:
                        - NET_ADMIN
                ports:
                        - 443:443
                        - 80:80
                volumes:
                        - /srv/letsencrypt:/config
                restart: unless-stopped
                depends_on:
                        - calibre
                        - nextcloud
                        #- tt-rss
                environment:
                        - PUID=1002
                        - PGID=1002
                        - TZ=America/Chicago
                        - URL=theitguy.rocks
                        - SUBDOMAINS=calibre,nextcloud
                        - VALIDATION=http
                        - DHLEVEL=4096
                        - EMAIL=erichendricks@fastmail.com

        nextcloud:
                image: linuxserver/nextcloud
                container_name: nextcloud
                depends_on:
                        - nextcloud-db
                volumes:
                        - /srv/nextcloud/config:/config
                        - /srv/nextcloud/data:/data
                restart: unless-stopped
                environment:
                        - PUID=1002
                        - PGID=1002
                        - TZ=America/Chicago

        nextcloud-db:
                image: linuxserver/mariadb
                container_name: nextcloud-db
                volumes:
                        - /srv/nextcloud/db:/config
                restart: unless-stopped
