name = "rhel-base"
description = "Vanilla RHEL 9.x"
version = "0.0.12"
modules = []
groups = []
distro = ""

[[packages]]
name = "ansible-core"
version = "*"

[[packages]]
name = "cockpit"
version = "*"

[[packages]]
name = "cockpit-storaged"
version = "*"

[[packages]]
name = "glibc-langpack-en.x86_64"
version = "*"

[[packages]]
name = "rhel-system-roles"
version = "*"

[[packages]]
name = "tmux"
version = "*"

[[packages]]
