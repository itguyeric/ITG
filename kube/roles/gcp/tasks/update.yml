# roles/gcp/tasks/update.yml
---
- name: Get the latest GKE master version
  google.cloud.gcp_container_cluster_info:
    location: "{{ zone }}"
    project: "{{ gcp_project }}"
    auth_kind: application
  register: gcp_cluster_info

- name: Update GKE cluster to the latest available version
  google.cloud.gcp_container_cluster:
    name: "{{ cluster_name }}"
    location: "{{ zone }}"
    project: "{{ gcp_project }}"
    node_version: "{{ gcp_cluster_info.resources[0].currentNodeVersion }}"
    master_version: "{{ gcp_cluster_info.resources[0].currentMasterVersion }}"
    auth_kind: application
    update: true
  when: gcp_cluster_info.resources[0].currentMasterVersion != gcp_cluster_info.resources[0].currentNodeVersion
