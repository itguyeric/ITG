---
# roles/gcp/tasks/upgrade-k8s.yml

- name: Fetch the current Kubernetes master version
  google.cloud.gcp_container_cluster_info:
    name: "{{ cluster_name }}"
    location: "{{ zone }}"
    project: "{{ gcp_project }}"
  register: cluster_info

- name: Debug current master version
  debug:
    msg: "Current master version is {{ cluster_info.resources[0].currentMasterVersion }}"

- name: Fetch all valid Kubernetes master versions
  google.cloud.gcp_container_cluster_info:
    name: "{{ cluster_name }}"
    location: "{{ zone }}"
    project: "{{ gcp_project }}"
  register: valid_master_versions

- name: Split valid master versions into a list
  set_fact:
    valid_master_versions_list: "{{ valid_master_versions.resources[0].validMasterVersions }}"

- name: Find the latest patch version within the same minor version
  set_fact:
    latest_patch_version: "{{ valid_master_versions_list | select('search', '^' + cluster_info.resources[0].currentMasterVersion.split('.')[0] + '\\.' + cluster_info.resources[0].currentMasterVersion.split('.')[1] + '\\.') | first | default('') }}"

- name: Fail if no valid patch version is found
  fail:
    msg: "No valid patch version found for the current Kubernetes version {{ cluster_info.resources[0].currentMasterVersion }}"
  when: latest_patch_version == ''

- name: Upgrade Kubernetes master to the latest patch version
  google.cloud.gcp_container_cluster:
    name: "{{ cluster_name }}"
    location: "{{ zone }}"
    project: "{{ gcp_project }}"
    cluster_version: "{{ latest_patch_version }}"
    update: master
  when: latest_patch_version != ''

- name: Upgrade Kubernetes nodes to the latest patch version
  google.cloud.gcp_container_cluster:
    name: "{{ cluster_name }}"
    location: "{{ zone }}"
    project: "{{ gcp_project }}"
    cluster_version: "{{ latest_patch_version }}"
    update: nodes
  when: latest_patch_version != ''

