---
- name: Delete Civo Kubernetes cluster
  command: >
    civo kubernetes remove {{ cluster_name }} --region {{ region }} --yes
  environment:
    CIVO_API_KEY: "{{ civo_token }}"
  register: civo_remove_result
  failed_when: "'sorry there is no' not in civo_remove_result.stderr"

- name: Wait for the cluster deletion to complete
  pause:
    minutes: 2

- name: Remove kubectl context for the cluster (ignore errors)
  command: >
    kubectl config delete-context {{ cluster_name }}
  ignore_errors: yes

- name: Remove kubectl cluster for the cluster (ignore errors)
  command: >
    kubectl config delete-cluster {{ cluster_name }}
  ignore_errors: yes

- name: Remove kubectl user for the cluster (ignore errors)
  command: >
    kubectl config unset users.{{ cluster_name }}
  ignore_errors: yes
