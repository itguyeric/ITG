# playbooks/update.yml
---
- name: Choose cloud provider and update Kubernetes
  hosts: localhost
  gather_facts: no

  vars_prompt:
    - name: "cloud_provider"
      prompt: "Choose cloud provider (do, civo, gcp)"
      private: no

  tasks:
    - name: Include provider-specific variables
      include_vars: "../vars/{{ cloud_provider }}.yml"

    - name: Update the Kubernetes cluster to the latest version
      include_role:
        name: "{{ cloud_provider }}"
        tasks_from: update
